<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>カラー数字検出 — ブラウザ推論デモ</title>
  <link rel="stylesheet" href="/src/app.css" />
</head>
<body class="bg-bg font-sans text-fg antialiased">
  <!-- サイドバー(タスク一覧・設定)は src/ui/shell.ts が描く。 -->
  <div id="shell"></div>
  <main class="px-4 py-6 md:pl-72 md:pr-8">
    <h1 class="text-xl font-bold">カラー数字検出</h1>
    <!-- モデル固有の数値は data-meta でロード済みモデルJSONから描く。
         HTMLに数値を書かないこと(src/nostale.test.ts が機械的に検査する)。 -->
    <p class="mt-2 max-w-3xl text-sm leading-relaxed text-muted">
      CIFAR-10 の風景写真に色付きの数字を重ねた合成画像から、数字の位置と種類を見つけます。
      比較対象は同じタスクを学習した CNN(ONNX Runtime Web / TensorFlow.js)です。
    </p>
    <p class="mt-2 max-w-3xl text-sm leading-relaxed text-muted">
      モデル: 論理ゲート回路(<span data-meta="kLabel">—</span>)、
      入力 <span data-meta="inputRes">—</span> /
      <span data-meta="inputChannels">—</span>チャンネル(<span data-meta="preprocLabel">—</span>、
      しきい値 <span data-meta="nThresholds">—</span>段)、
      クラス数 <span data-meta="nClasses">—</span>。<span data-about="recipe"></span>
    </p>
    <p class="mt-3 max-w-3xl rounded-lg border border-line bg-panel p-3 text-xs leading-relaxed text-muted"
       data-note="concurrency"></p>
    <div id="samples"></div>
    <div id="grid"></div>
  </main>
  <script type="module" src="/src/det_main.ts"></script>
</body>
</html>
