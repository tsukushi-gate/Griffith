<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>実物体検出 — ブラウザ推論デモ</title>
  <link rel="stylesheet" href="/src/app.css" />
</head>
<body class="bg-bg font-sans text-fg antialiased">
  <div id="shell"></div>
  <main class="px-4 py-6 md:pl-72 md:pr-8">
    <h1 class="text-xl font-bold">実物体検出</h1>
    <p class="mt-2 max-w-3xl text-sm leading-relaxed text-muted">
      Pascal VOC の写真から、人・車・犬の位置を見つけます。
      比較対象は同じタスクを学習した CNN(ONNX Runtime Web)です。
    </p>
    <p class="mt-2 max-w-3xl text-sm leading-relaxed text-muted">
      モデル: 論理ゲート回路(<span data-meta="kLabel">—</span>)、
      入力 <span data-meta="inputRes">—</span> /
      <span data-meta="inputChannels">—</span>チャンネル(<span data-meta="preprocLabel">—</span>、
      しきい値 <span data-meta="nThresholds">—</span>段)、
      クラス数 <span data-meta="nClasses">—</span>(<span data-meta="labels">—</span>)。<span data-about="recipe"></span>
    </p>
    <p class="mt-3 max-w-3xl rounded-lg border border-line bg-panel p-3 text-xs leading-relaxed text-muted"
       data-note="concurrency"></p>
    <div id="samples"></div>
    <div id="grid"></div>
    <p class="mt-6 max-w-3xl text-xs leading-relaxed text-muted">
      サンプル画像の出典: The PASCAL Visual Object Classes (VOC) Challenge。
      画像は Flickr 由来で著作権は各撮影者に帰属します。
      <b>非商用の研究目的に限って</b>、モデル入力サイズに縮小して掲載しています。
    </p>
  </main>
  <script type="module" src="/src/detreal_main.ts"></script>
</body>
</html>
