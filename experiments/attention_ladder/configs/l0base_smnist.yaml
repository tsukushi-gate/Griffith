task: smnist            # classification
stage: L0b              # 梯子の実基準(attention=fp, ffn=logic)
model: {d_model: 128, n_heads: 4, n_layers: 2, mlp_ratio: 2, attention: fp, ffn: logic, dropout: 0.0}
train: {epochs: 10, batch_size: 128, lr: 1.0e-3, weight_decay: 0.0}
seeds: [0, 1, 2]
wandb: {enabled: true, group: attention_ladder, tags: [L0b, smnist]}
