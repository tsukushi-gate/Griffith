program: experiments/train_llvit.py
method: bayes
metric:
  name: top1
  goal: maximize
command:
  - ${env}
  - ${interpreter}
  - ${program}
  - --config
  - configs/recipes/llvit_cifar10_repro.yaml
  - ${args}
parameters:
  logic_lr:
    values: [0.005, 0.01, 0.02, 0.04]
  ann_lr:
    values: [0.0002, 0.0005, 0.001]
  lut_mapping:
    values: [learnable, random]
  lut_efd:
    values: [official, paper]
  thermometer_mode:
    values: [uniform, distributive]
  mixup:
    values: [0.2, 0.5, 0.8]
  cutmix:
    values: [0.0, 0.5, 1.0]
  label_smoothing:
    values: [0.0, 0.05, 0.1]
  conditional_sum_quant_eval:
    values: [true]
early_terminate:
  type: hyperband
  min_iter: 10
