# DLGN MNIST クイックレシピ + 500step毎hard eval(N0基線)。
# dlgn_mnist_quick.yaml と同一構成に run.eval_interval=500 を足しただけ。
# MNIST train=60000 / batch=128 / drop_last=True → 468 step/epoch × 3ep = 1404 step。
# eval は step 500,1000 と各エポック末で記録される(runner.py の do_eval ロジック)。
# 実行: uv run griffith train configs/recipes/dlgn_mnist_quick_500ev.yaml run.seed=42
# grid: uv run griffith launch --grid "run.seed=[42,43,44]" configs/recipes/dlgn_mnist_quick_500ev.yaml
data:
  name: mnist
  batch_size: 128
model:
  kind: dlgn
  k: 2000
  layers: 3
  n_inputs: 2
  parameterization: softmax
  tau: 10.0
optim:
  name: adam
  lr: 0.01
run:
  epochs: 3
  seed: 42
  eval_interval: 500
  wandb: false  # 有効化するには wandb: true と WANDB_API_KEY を設定
# 期待メトリクス(3エポックでの最低ライン)
expected_metrics:
  hard_acc_min: 0.90
