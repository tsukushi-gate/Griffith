# DLGN MNIST 基線延長レシピ(改訂、N0基線)。
# dlgn_mnist_quick_500ev.yaml ベースで run.epochs=30(468 step/ep × 30 = 14040 step)。
# quick 3ep では hard_acc 0.914 未達だったため基線を延長(プロトコル改訂)。
# eval は 500step毎 + 各エポック末(runner.py の do_eval ロジック)。
# 実行: uv run griffith train configs/recipes/dlgn_mnist_quick30_500ev.yaml run.seed=42
# grid: uv run griffith launch --grid "run.seed=[42,43,44]" configs/recipes/dlgn_mnist_quick30_500ev.yaml
data:
  name: mnist
  batch_size: 128
model:
  kind: dlgn
  k: 2000
  layers: 3
  n_inputs: 2
  parameterization: softmax
  tau: 10.0
optim:
  name: adam
  lr: 0.01
run:
  epochs: 30
  seed: 42
  eval_interval: 500
  wandb: false  # 有効化するには wandb: true と WANDB_API_KEY を設定
# 期待メトリクス(30エポックでの最低ライン)
expected_metrics:
  hard_acc_min: 0.93
