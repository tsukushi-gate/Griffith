model: llvit
dataset: cifar10
data_root: data-llvit
output_dir: checkpoints/llvit
image_size: 224
patch_size: 16
dim: 192
depth: 12
heads: 3
mlp_ratio: 4
thermometer_bits: 8
thermometer_mode: distributive
lut_hidden: 768
lut_out: 192
lut_inputs: 6
lut_mapping: learnable
lut_efd: official
epochs: 300
batch_size: 128
lr: 0.0005
ann_lr: 0.0005
logic_lr: 0.02
weight_decay: 0.05
warmup_epochs: 5
min_lr_factor: 0.01
label_smoothing: 0.1
mixup: 0.8
cutmix: 1.0
randaugment: true
random_erasing: 0.25
amp: true
grad_clip: 1.0
ema_decay: 0.9998
calibrate_thermometer_source: teacher
calibrate_thermometer_batches: 8
calibrate_thermometer_samples: 8192
distill_alpha: 0.3
feature_distill_alpha: 1.0
distill_temperature: 2.0
channel_mixer_pretrain_epochs: 8
channel_mixer_pretrain_batches: 0
channel_mixer_pretrain_lr: 0.01
channel_mixer_pretrain_weight_decay: 0.0
conditional_sum_quant_eval: true
wandb: false  # 有効化するには wandb: true と WANDB_API_KEY を設定
wandb_group: llvit-cifar10-gate3
