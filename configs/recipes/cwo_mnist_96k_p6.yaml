# 成果共有 computed-wiring-overlay / 較正アンカー C3: MNIST 96K の rot + 2D 近傍(P6)。
# 社内先行実験掃引B の P6(幅 16,000 × 6 層 = 96,000 ゲート)。
# 配線規則は 48K の P6 と同じで、幅だけが違う(層 0 の入力は 784 のまま)。
# tau は先行実験の tau = 30·W/8000 に従って 60。
#
# この構成の seed 0 のネットが実機アンカー C2(DE0-CV オンチップで 1,000 枚全数一致・
# 12,129 cyc・2,061.2 inf/s)の入力になる(先行実験 nets/w16000_p6 と同じ経路)。
# 原値(2 seed): 0.9527 / 0.9527(先行実験実測表掃引B。P0 比 +1.21pt)
#
# 実行: uv run md launch --grid "run.seed=[0,1]" configs/recipes/cwo_mnist_96k_p6.yaml --local
data:
  name: mnist
  batch_size: 100
  params:
    binarize_threshold: 0.5
model:
  kind: dlgn
  k: 16000
  layers: 6                        # 96,000 ゲート
  n_inputs: 2
  parameterization: softmax
  selection: soft
  tau: 60.0                        # 30 · 16000/8000
  connections:
    kind: rot
    s_a: [1, 0, 0, 0, 0, 0]
    s_b: [28, 4, 20, 90, 400, 1800]
optim:
  name: adam
  lr: 0.01
run:
  epochs: 8
  eval_interval: 0
  wandb: true
  wandb_group: dlgn-ffn
  wandb_job_type: train
  wandb_tags: [computed-wiring-overlay, calibration, P6, mnist-96k]
  wandb_notes: >-
    成果共有 computed-wiring-overlay の較正アンカー C3。MNIST 96K の rot + 層 0 の
    2D 近傍(P6)。seed 0 のネットは実機アンカー C2(DE0-CV オンチップ実機)の入力を兼ねる。
  wandb_hypothesis: >-
    rot の精度は幅 8,000 → 16,000 でも保たれ、固定ランダム配線を上回る。
  run_name: cwo_mnist_96k_p6
  export_netlist: true
expected_metrics:
  hard_acc_min: 0.9477
