# DLGN MNIST KD-to-native レシピ。
# dlgn_mnist_quick30_500ev.yaml(N0基線: steps_to(0.90)中央値3744/最終0.9088/6k=0.8522)
# に distill(知識蒸留)ブロックを追加。teacher は二値化MNIST(threshold=0.5)で学習した
# teacher-float MLP(784-300-100-10, test_acc=0.9747, checkpoints/teacher_mlp_float_mnist_20260703_022747)。
#
# 重要な整合性2点(確認済み):
#   1. standardize: true は必須。GroupSum τ(model.tau)× KD温度 T の二重温度で
#      standardize=False のままだとKLが崩壊する(' で実証)。
#   2. teacher_transform: 'binarize05' が必須。このteacherは二値化MNIST(x∈{0,1})で
#      学習済みだが、runner._apply_distill は load_raw(未二値化 [0,1] 連続値)をteacherに
#      渡す実装のため、'none'のままだと入力分布不整合でteacherロジットが壊れる。
#      convert/teacher.py の TEACHER_TRANSFORMS に 'binarize05'(閾値0.5二値化)を追加して
#      対応した(最小diff、既存テスト無影響: tests/l5_hybrid/test_teacher.py)。
#
# 実行: uv run griffith launch configs/recipes/dlgn_mnist_kd_quick30.yaml --grid "distill.alpha=[0.25,0.5],distill.temperature=[1,2,4]" --local
data:
  name: mnist
  batch_size: 128
model:
  kind: dlgn
  k: 2000
  layers: 3
  n_inputs: 2
  parameterization: softmax
  tau: 10.0
optim:
  name: adam
  lr: 0.01
run:
  epochs: 30
  seed: 42
  eval_interval: 500
  wandb: false  # 有効化するには wandb: true と WANDB_API_KEY を設定
  run_name: d5_n1_kd
distill:
  teacher: 'ckpt:checkpoints/teacher_mlp_float_mnist_20260703_022747/best.pt'
  standardize: true
  teacher_transform: binarize05
  cache: true
  alpha: 0.5
  temperature: 4.0
# 期待メトリクス(30エポックでの最低ライン。基線と同水準を目安)
expected_metrics:
  hard_acc_min: 0.90
