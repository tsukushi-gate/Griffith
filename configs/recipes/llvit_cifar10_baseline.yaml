model: baseline
dataset: cifar10
data_root: data-llvit
output_dir: checkpoints/llvit
image_size: 224
patch_size: 16
dim: 192
depth: 12
heads: 3
mlp_ratio: 4
epochs: 300
batch_size: 128
lr: 0.00005
ann_lr: 0.00005
logic_lr: 0.02
weight_decay: 0.05
warmup_epochs: 5
min_lr_factor: 0.01
label_smoothing: 0.1
mixup: 0.8
cutmix: 1.0
randaugment: true
random_erasing: 0.25
amp: true
grad_clip: 1.0
ema_decay: 0.9998
init_from_timm: true
timm_model: deit_tiny_patch16_224
timm_pretrained: true
stop_at_acc: 95.0
conditional_sum_quant_eval: false
wandb: false  # 有効化するには wandb: true と WANDB_API_KEY を設定
wandb_group: llvit-cifar10-gate2
