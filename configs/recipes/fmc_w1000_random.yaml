# 事前実験 fmc-wiring-w1000(配線の本実験の前段)/ 腕 A0: 幅 1000 の固定ランダム配線(基準)。
# エディタのサンプル(rot / butterfly の段別パラメータ例)を作る前に、幅 1000 × 6 層で
# 規則配線が固定ランダム配線と同等以上に学習できるかを見た。較正アンカーではない
# (cwo_* / tests/l3_paper には入れない)。
#
# 実測(CPU、`griffith train`、hard_acc、seed 0 / 1): 90.67 / 90.66%(平均 90.67%)
#   wandb: bo4fjd56 / 6vovx6dk(group dlgn-ffn、tag fmc-wiring-w1000)
# 内部調査リポジトリ先行実験の幅曲線(random、6 層、8 ep、tau = 30·W/8000)では w1000 = 91.38%。
# 学習レジームは cwo_mnist_48k_p0.yaml と同一で、幅と tau だけ 1000 / 3.75 にする。
data:
  name: mnist
  batch_size: 100
  params:
    binarize_threshold: 0.5
model:
  kind: dlgn
  k: 1000
  layers: 6
  n_inputs: 2
  parameterization: softmax
  selection: soft
  tau: 3.75
  connections:
    kind: random_uniform
optim:
  name: adam
  lr: 0.01
run:
  epochs: 8
  eval_interval: 0
  wandb: true
  wandb_group: dlgn-ffn
  wandb_job_type: train
  wandb_tags: [fmc-wiring-w1000, pre-experiment, random, mnist-6k]
  wandb_notes: >-
    エディタのサンプル(rot / butterfly の段別パラメータ例)を作る前の事前実験。
    幅 1000 × 6 層で規則配線が学習できるかを見る。本 run は固定ランダム配線の基準腕。
    内部調査リポジトリ先行実験の幅曲線では w1000 random = 91.38%(8 ep、tau 3.75)。
  wandb_hypothesis: >-
    幅 1000 でも、受容野 100% に設計した rot と 4 入力 butterfly は
    固定ランダム配線と同等以上の精度になる。本 run はその基準。
  run_name: fmc_w1000_random
  export_netlist: false
