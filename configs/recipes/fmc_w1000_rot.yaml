# 事前実験 fmc-wiring-w1000(配線の本実験の前段)/ 腕 A1: 幅 1000 向けに受容野から再設計した rot。
# 層 0 は 28x28 画像の 2D 近傍(s_a=1 右 1 画素、s_b=28 で 1 行下)、
# 隠れ層のずらし量は幅 1000 でクラス受容野が 100% になるよう、配線統計
# (analysis/wiring_stats.class_receptive_field、入力 784 / 幅 1000)で選んだ {6, 30, 150, 750, 500}
# (比 5 の幾何級数 + 最終段 500。平均 / 最小とも 1.000)。
# 内部調査リポジトリ先行実験 P6 のずらし量 {4, 20, 90, 400, 1800} は幅 8000 向けで、
# そのまま使うと受容野が欠け 0.888 / 0.797 に落ちる(異なる幅の間でずらし量を使い回さない)。
# エディタのサンプル「MNIST rot 1000 学習」(tools/editor/frontend/src/samples/wiringSamples.json)は
# 本レシピと同じ配線(tests/test_editor_samples_wiring.py が層ごとに一致を検査)。
#
# 実測(CPU、`griffith train`、hard_acc、seed 0 / 1): 92.65 / 92.01%(平均 92.33%、random 比 +1.67pt)
#   wandb: 7lyftq95 / 9348xoxd(group dlgn-ffn、tag fmc-wiring-w1000)。8 epoch の壁時計 419 / 370 秒
data:
  name: mnist
  batch_size: 100
  params:
    binarize_threshold: 0.5
model:
  kind: dlgn
  k: 1000
  layers: 6
  n_inputs: 2
  parameterization: softmax
  selection: soft
  tau: 3.75
  connections:
    kind: rot
    s_a: [1, 0, 0, 0, 0, 0]
    s_b: [28, 6, 30, 150, 750, 500]
optim:
  name: adam
  lr: 0.01
run:
  epochs: 8
  eval_interval: 0
  wandb: true
  wandb_group: dlgn-ffn
  wandb_job_type: train
  wandb_tags: [fmc-wiring-w1000, pre-experiment, rot, mnist-6k]
  wandb_notes: >-
    エディタのサンプル(rot / butterfly の段別パラメータ例)を作る前の事前実験。
    幅 1000 × 6 層で、層 0 を 2D 近傍、隠れ層をクラス受容野 100% の幾何級数
    {6, 30, 150, 750, 500} に再設計した rot。基準は fmc_w1000_random。
  wandb_hypothesis: >-
    幅に合わせて受容野 100% に再設計した rot は、幅 1000 でも固定ランダム配線と
    同等以上(内部調査リポジトリ先行実験の幅 8000 では +1.29pt)になる。
  run_name: fmc_w1000_rot
  export_netlist: false
