# DLGN MNISTクイックレシピ。k=2000×3層×3エポックの短時間検証用。
# 実行: uv run griffith train configs/recipes/dlgn_mnist_quick.yaml
# GPU実行: uv run griffith launch --grid "run.seed=[42]" configs/recipes/dlgn_mnist_quick.yaml --modal
data:
  name: mnist
  batch_size: 128
model:
  kind: dlgn
  k: 2000
  layers: 3
  n_inputs: 2
  parameterization: softmax
  tau: 10.0
optim:
  name: adam
  lr: 0.01
run:
  epochs: 3
  seed: 42
  wandb: false  # 有効化するには wandb: true と WANDB_API_KEY を設定
# 期待メトリクス(3エポックでの最低ライン。較正は実測ベースで行う)
expected_metrics:
  hard_acc_min: 0.90
